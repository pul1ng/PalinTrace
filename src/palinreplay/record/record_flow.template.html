<script>
(() => {
'use strict';
const D=JSON.parse(document.getElementById('record-data').textContent);
const $=id=>document.getElementById(id), esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const seconds=x=>x==null?'未采集':x<.01?(x*1000).toFixed(1)+' ms':x.toFixed(2)+' s';
const bytes=x=>{if(x==null)return '未采集';const v=Math.abs(x),s=x<0?'−':'';return s+(v>=1073741824?(v/1073741824).toFixed(2)+' GiB':v>=1048576?(v/1048576).toFixed(3)+' MiB':v>=1024?(v/1024).toFixed(1)+' KiB':v+' B');};
const json=x=>JSON.stringify(x,null,2), shorten=(s,n=130)=>String(s??'').replace(/\s+/g,' ').slice(0,n);
const K={system:{label:'系统',lane:0,color:'#98a1af'},input:{label:'输入',lane:0,color:'#7799e9'},model:{label:'模型',lane:1,color:'#9c80b8'},tool:{label:'工具',lane:2,color:'#d9974c'},accepted:{label:'接纳',lane:3,color:'#79b28b'},snapshot:{label:'快照',lane:4,color:'#69aaa3'},commit:{label:'节点',lane:5,color:'#6e92d4'}};
const byId=new Map(D.events.map(e=>[e.id,e]));
let selected=byId.has(location.hash.slice(1))?location.hash.slice(1):D.nodes[0].snapshot_event;
let durationMode=D.timeline_complete,hideTools=false,collapsed=new Set(),query='',kind='all',detailTab='overview',timer=null,flowMode='overall',flowIndex=0;
let activePhase=null;
const phaseByGroup=new Map(D.phases.flatMap((p,i)=>p.groups.map(group=>[group,i])));
const timed=D.events.filter(e=>e.start!==null&&e.duration!==null).sort((a,b)=>a.start-b.start||D.events.indexOf(a)-D.events.indexOf(b));
const searchText=new Map(D.events.map(e=>[e.id,`${e.group} ${e.kind} ${K[e.kind].label} ${e.title} ${e.preview} ${json(e.data)}`.toLowerCase()]));
function matches(e){return (kind==='all'||e.kind===kind)&&(!hideTools||e.kind!=='tool')&&query.trim().toLowerCase().split(/\s+/).filter(Boolean).every(t=>searchText.get(e.id).includes(t));}
function listEvents(){return D.events.filter(matches);}
function phaseRanges(){
 const domain=Math.max(durationMode?D.total_sec:D.events.length,0.001);
 let cursor=0;
 return D.phases.map((p,i)=>{
  const count=D.events.filter(e=>phaseByGroup.get(e.group)===i).length;
  const start=durationMode?p.start:cursor,duration=durationMode?p.duration:count;
  cursor+=count;
  return {left:start/domain*100,width:duration/domain*100,count};
 });
}
function applyPhaseHighlight(){
 document.querySelectorAll('[data-phase-index]').forEach(element=>{
  const match=Number(element.dataset.phaseIndex)===activePhase;
  element.classList.toggle('phase-highlight',activePhase!==null&&match);
  element.classList.toggle('phase-dim',activePhase!==null&&!match);
 });
}
function setActivePhase(index){if(activePhase!==index){activePhase=index;applyPhaseHighlight();}}
function renderPhases(){
 const ranges=phaseRanges();
 $('phase-ribbon').innerHTML=D.phases.map((p,i)=>{
  const r=ranges[i],compact=r.width<7,label=compact?(i===1?'C0':String(i+1).padStart(2,'0')):String(i+1).padStart(2,'0')+' '+p.name;
  return `<button class="${compact?'phase-compact':''}" data-phase="${p.event}" data-phase-index="${i}" aria-label="${esc(p.name+'，'+seconds(p.duration))}" style="left:${r.left}%;width:${r.width}%"><span class="phase-copy"><b>${esc(label)}</b>${compact?'':`<span>${seconds(p.duration)}</span>`}</span></button>`;
 }).join('');
 applyPhaseHighlight();
}
function setView(view){const trace=view==='trace';$('trace-view').hidden=!trace;$('flow-view').hidden=trace;$('tab-trace').setAttribute('aria-selected',trace);$('tab-flow').setAttribute('aria-selected',!trace);if(!trace)stop();}
function select(id,{scroll=true,reveal=false}={}){
 if(!byId.has(id))return;
 if(reveal){query='';kind='all';hideTools=false;$('search').value='';$('kind-filter').value='all';$('calls').setAttribute('aria-pressed','false');$('calls').textContent='⊟ 工具调用';}
 selected=id;detailTab='overview';collapsed.delete(byId.get(id).group);renderLedger();renderTimeline();renderDetail();$('detail').scrollTop=0;renderNodes();updatePlayer();
 if(scroll){const r=$('ledger').querySelector(`[data-event="${id}"]`);if(r){const delta=r.getBoundingClientRect().top-$('ledger').getBoundingClientRect().top+$('ledger').scrollTop-50;$('ledger').scrollTo({top:Math.max(0,delta),behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth'});}}
 history.replaceState(null,'','#'+id);$('live').textContent=`已选择 ${byId.get(id).group} ${byId.get(id).title}`;
}
function renderLedger(){
 const all=D.groups.every(g=>collapsed.has(g.id));$('fold').setAttribute('aria-pressed',all);$('fold').textContent=all?'⊞ 轮次':'⊟ 轮次';
 let count=0;
 $('ledger').innerHTML=D.groups.map(g=>{const events=D.events.filter(e=>e.group===g.id&&matches(e));if(!events.length)return '';count+=events.length;
 return `<div class="group-heading" data-phase-index="${phaseByGroup.get(g.id)}"><button class="group-toggle" data-group="${esc(g.id)}" aria-expanded="${!collapsed.has(g.id)}"><span>${collapsed.has(g.id)?'▸':'▾'}</span><strong>${esc(g.label)}</strong></button><span class="group-note">${esc(g.note)}</span><span class="group-total">${seconds(g.duration)}</span></div>${collapsed.has(g.id)?'':events.map(e=>{
 const preview=e.kind==='tool'?` → exit ${e.exit_code??'?'} · ${shorten(e.preview,150)}`:e.preview;
 return `<button type="button" class="record-row ${e.kind} ${e.error?'error':''} ${e.id===selected?'selected':''}" data-event="${e.id}" data-phase-index="${phaseByGroup.get(e.group)}" aria-pressed="${e.id===selected}"><span class="row-index">${String(D.events.indexOf(e)+1).padStart(2,'0')}</span><span><span class="tag ${e.kind} ${e.error?'error':''}">${K[e.kind].label}</span></span><span class="row-title">${esc(shorten(e.title,170))}<span class="row-preview">${esc(shorten(preview,170))}</span></span><span class="row-time">${seconds(e.duration)}</span></button>`;}).join('')}`;
 }).join('') || '<div class="empty-state">没有匹配的记录<br>试试 C0、命令关键词，或清空筛选。</div>';
 $('timeline-summary').textContent=`${D.nodes.length} 个节点 · ${D.counts.model_calls} 次模型调用 · ${D.counts.tool_calls} 次工具执行${D.timeline_complete?'':' · 计时明细未采集或已截断'}${query||kind!=='all'||hideTools?' · '+count+' 条匹配记录':''}`;
 applyPhaseHighlight();
}
function renderTimeline(){
 const events=durationMode?timed:D.events,domain=Math.max(durationMode?D.total_sec:events.length,0.001);
 const ticks=Array.from({length:7},(_,i)=>domain*i/6);
 let html='<div class="axis">'+ticks.map(t=>`<span class="tick" style="left:${t/domain*100}%">${durationMode?t.toFixed(t===D.total_sec?1:0)+'s':Math.round(t)}</span>`).join('')+'</div>';
 html+=ticks.map(t=>`<div class="gridline" style="left:${t/domain*100}%"></div>`).join('');
 html+=phaseRanges().map((r,i)=>`<div class="phase-window" data-phase-index="${i}" style="left:${r.left}%;width:${r.width}%"></div>`).join('');
 for(let lane=0;lane<6;lane++)html+=`<div class="lane" style="top:${20+lane*20}px">${events.filter(e=>K[e.kind].lane===lane).map(e=>{
 const ix=events.indexOf(e),left=(durationMode?e.start:ix)/domain*100,width=(durationMode?e.duration:0.75)/domain*100;
 return `<button class="timeline-block ${e.id===selected?'selected':''} ${!matches(e)?'dim':''} ${e.error?'error':''}" data-timeline="${e.id}" data-phase-index="${phaseByGroup.get(e.group)}" aria-label="${esc(e.group+' '+e.title+' '+seconds(e.duration))}" style="left:clamp(0px,${left}%,calc(100% - 3px));width:${Math.min(100-left,width)}%;background:${K[e.kind].color}"></button>`;}).join('')}</div>`;
 const current=byId.get(selected);if(!durationMode||current.start!==null){const x=(durationMode?current.start:events.indexOf(current))/domain*100;html+=`<div class="guide" data-phase-index="${phaseByGroup.get(current.group)}" style="left:${x}%"></div>`;}
 $('timeline-plot').innerHTML=html;
 applyPhaseHighlight();
}
function renderNodes(){const current=byId.get(selected).group;$('node-strip').innerHTML='<span>节点</span>'+D.nodes.map(n=>`<button class="node-button ${n.reuses_c0?'reused':''} ${current===n.label?'active':''}" data-node="${n.label}" data-phase-index="${phaseByGroup.get(n.label)}" aria-pressed="${current===n.label}" aria-label="查看 ${n.label}，${n.reuses_c0?'复用 C0 基座':'Btrfs 只读快照'}">${n.label}</button>`).join('');applyPhaseHighlight();}
function pretty(value){return `<pre>${esc(typeof value==='string'?value:json(value))}</pre>`;}
function disclosure(label,value){return `<details><summary>${esc(label)}</summary>${pretty(value)}</details>`;}
function detailPhases(items,total){return items.map(([name,note,time])=>`<div class="phase-item"><span class="dot"></span><div>${esc(name)}${note?'<p>'+esc(note)+'</p>':''}${time!=null&&total>0?`<div class="bar-line"><i style="width:${Math.min(100,time/total*100)}%"></i></div>`:''}</div><span class="sec">${seconds(time)}</span></div>`).join('');}
function renderDetail(){
 const e=byId.get(selected),n=e.node?D.nodes.find(x=>x.label===e.node):null;
 const base=`${!matches(e)?'<div class="current-hidden">这条记录不在当前筛选结果中。时间轴和详情仍保留当前选择。</div>':''}<div class="detail-topline"><span class="tag ${e.kind}">${K[e.kind].label}</span><span>${esc(e.group)} · #${D.events.indexOf(e)+1}</span></div><h2>${esc(shorten(e.title,150))}</h2>`;
 let html=base;
 const desc=e.kind==='snapshot'?(n.reuses_c0?'首次模型调用之前，引用 preload 已冻结的只读 C0；本轮不重新导出或采集初始文件。':'完整步骤结束后，暂停任务进程、同步写入并创建只读 CoW 快照，然后复核上下文并发布节点。'):e.kind==='tool'?'真实 Docker 工具调用。原始结果与 Agent 实际接纳的观察内容分别保存。':e.kind==='model'?'模型请求、原始 SDK 响应和实际接纳的消息可分别检查。重试仍属于当前 Step。':e.preview;
 html+=`<p class="detail-description">${esc(shorten(desc,210))}</p>`;
 if(e.kind==='snapshot'){
  html+=`<div class="detail-metrics"><div><div class="metric-label">快照与提交</div><div class="metric-value">${seconds(e.duration)}</div></div><div><div class="metric-label">池镜像物理占用</div><div class="metric-value">${bytes(n.image_allocated_bytes)}</div></div><div><div class="metric-label">池镜像相对 C0 增长</div><div class="metric-value">${bytes(n.pool_delta_from_c0_bytes)}</div></div><div><div class="metric-label">本边界轨迹元数据增长</div><div class="metric-value">${bytes(n.store_delta)}</div></div><div><div class="metric-label">池镜像逻辑容量</div><div class="metric-value">${bytes(n.image_capacity_bytes)}</div></div><div><div class="metric-label">保存方式</div><div class="metric-value" style="font-family:inherit;font-size:13px">${n.reuses_c0?'复用 C0 基座':'Btrfs CoW 快照'}</div></div></div>`;
 }else html+=`<div class="detail-metrics"><div><div class="metric-label">${e.duration==null?'计时口径':'记录耗时'}</div><div class="metric-value" style="${e.duration==null?'font-family:inherit;font-size:12px':''}">${e.duration==null?'未单独计时':seconds(e.duration)}</div></div><div><div class="metric-label">${e.kind==='tool'?'退出码':'相对开始'}</div><div class="metric-value">${e.kind==='tool'?(e.exit_code??'—'):(e.start==null?'—':seconds(e.start))}</div></div></div>`;
 html+=`<div class="detail-tabs"><button data-detail="overview" class="${detailTab==='overview'?'active':''}">流程说明</button><button data-detail="evidence" class="${detailTab==='evidence'?'active':''}">记录证据</button></div>`;
 if(detailTab==='evidence'){
  if(e.kind==='model'||e.kind==='tool'){
   html+=disclosure('调用输入 / 参数',e.data.request)+disclosure('调用时的上下文',e.data.context)+disclosure('原始返回结果',e.data.result)+disclosure('Agent 实际接纳',e.data.accepted)+disclosure('派发、返回、交付、接纳事件',e.data.events);
   html+=`<p class="small-note">这里展示 Store 的保存值，模型响应为 SDK 表示；不包含文件快照正文或 HTTP 原始字节。</p>`;
  }else html+=pretty(e.data);
 }else if(e.kind==='snapshot'){
  const c=n.capture;
  const parts=[['取得 Agent 上下文','保存采集前的消息、计数与输入位置。',null],
   ['文件状态捕获（后端计时）',n.reuses_c0?'核对并引用已有基座的只读快照。':'创建只读 Btrfs 快照，保存运行配置与状态引用。',c.duration_sec??null],
   ['复核并原子提交','再次确认上下文与接纳事实，发布完整节点。',null]];
  html+=detailPhases(parts,e.duration)+`<p class="small-note">子项属于节点保存过程，不重复计入总耗时；未单独采集的阶段不推算。池镜像占用来自该节点保存时的测量，包含共享数据、元数据及池内其他工作区。相对 C0 的增长不是单个快照的独占空间，也不等同于文件修改量。</p><div class="kv"><span>快照路径</span><b>${esc(n.snapshot.name)}</b><span>快照 UUID</span><b>${esc(n.snapshot.uuid)}</b><span>存储池</span><b>${esc(n.snapshot.location.volume)}</b><span>已接纳序号</span><b>${n.accepted_event_sequence}</b></div>`;
  html+=disclosure('节点 Agent 上下文',n.context)+disclosure('节点输入位置',n.input_position)+`<button class="detail-action" data-open-flow="snapshot">展开 Btrfs 快照子流程 →</button>`;
 }else if(e.kind==='model'||e.kind==='tool'){
  const events=e.data.events,labels={dispatched:'派发',result:'返回',delivered:'交付',accepted:'接纳'};
  html+='<div class="event-chain">'+Object.entries(labels).map(([key,label])=>`<span class="${events.some(x=>x.kind===key)?'':'off'}">${label} ${events.some(x=>x.kind===key)?'✓':'—'}</span>`).join('')+'</div>';
  if(e.kind==='tool'){
   html+='<div class="subhead">执行命令</div>'+pretty(e.data.request.action.command)+'<div class="subhead">返回内容</div>'+pretty(String(e.data.result??'').slice(0,2200));
   if(String(e.data.result??'').length>2200)html+='<p class="small-note">此处为预览；完整返回值见“记录证据”。</p>';
   if(e.error)html+='<p class="small-note">工具退出码非零，但结果已明确并被完整接纳，因此该 Step 仍可提交。</p>';
  }else{
   html+='<div class="subhead">输入与动作</div><div class="kv"><span>输入消息</span><b>'+e.data.request.messages.length+' 条</b><span>Prompt tokens</span><b>'+(e.data.usage.prompt_tokens??'—')+'</b><span>完成 tokens</span><b>'+(e.data.usage.completion_tokens??'—')+'</b></div>';
   const msg=e.data.result.choices[0].message;for(const call of msg.tool_calls||[])html+=pretty({name:call.function.name,arguments:call.function.arguments});
  }
  const accepts=e.data.accepted;html+='<div class="subhead">接纳位置</div><p class="small-note">'+(accepts?`消息区间 [${accepts.start}, ${accepts.stop})；实际接纳内容与原始结果分开记录。`:'无接纳记录。')+'</p>';
 }else if(e.kind==='commit'){
  html+=detailPhases([['确认调用完整','模型、完整工具组、结果与接纳必须全部齐全。',null],['关联持久材料','上下文＋输入位置＋完整文件 State。',null],['事务提交 Ci','材料校验通过后才更新当前节点。',null]],1);
  html+=`<div class="kv"><span>节点 ID</span><b>${esc(n.node_id)}</b><span>文件 State</span><b>${esc(n.state_id)}</b><span>只读快照</span><b>${esc(n.snapshot.name)}</b></div><p class="small-note">该页面仅用于浏览。存储完整性校验不等于在新容器中执行 verify-restore。</p>`;
 }else if(e.kind==='accepted')html+=pretty(e.data.accepted||e.data);
 else if(e.kind==='input')html+=pretty(e.data.content);
 else html+=pretty(e.data);
 html+=`<div class="source-ref">源码位置<br>${esc(e.source)}</div>`;
 $('detail').innerHTML=html;
}
function updatePlayer(){const events=listEvents(),index=events.findIndex(e=>e.id===selected);$('position').max=Math.max(0,events.length-1);$('position').value=Math.max(0,index);$('position').disabled=events.length===0;$('position-label').textContent=`${index<0?'—':index+1} / ${events.length}`;$('previous').disabled=index<=0;$('next').disabled=index>=events.length-1||events.length===0;$('play').disabled=events.length===0;}
function move(direction){const events=listEvents();let i=events.findIndex(e=>e.id===selected);i=Math.max(0,Math.min(events.length-1,i+direction));if(events[i])select(events[i].id);return i<events.length-1;}
function stop(){if(timer!==null)clearInterval(timer);timer=null;$('play').textContent='▷ 浏览播放';$('play').setAttribute('aria-pressed','false');}
function refreshFilter(){stop();renderLedger();renderTimeline();renderDetail();updatePlayer();}
function tooltip(event,id){const e=byId.get(id),t=$('tooltip');t.textContent=`${e.group} · ${K[e.kind].label}\n${shorten(e.title,65)}\n${seconds(e.duration)}${e.start==null?'':' · 开始 '+seconds(e.start)}`;t.style.whiteSpace='pre-line';t.hidden=false;const x=Math.min(event.clientX+12,innerWidth-t.offsetWidth-10),y=Math.min(event.clientY+16,innerHeight-t.offsetHeight-10);t.style.left=Math.max(8,x)+'px';t.style.top=Math.max(8,y)+'px';}

// Process explanations reflect current source, and are distinct from measured timings.
const FLOW={

function relatedRecord(f){
 let events=D.events.filter(e=>e.group===f[7]);
 if(!events.length)events=D.events.filter(e=>e.group===D.nodes.at(-1).label);
 let type='snapshot';
 if(flowMode==='step')type=['model','model','model','accepted','tool','tool','accepted','snapshot','snapshot','commit'][flowIndex];
 else if(flowMode==='snapshot'&&flowIndex>=6)type='commit';
 else if(flowMode==='overall')type=flowIndex===4?'input':flowIndex===6?'model':type;
 const matching=events.filter(e=>e.kind===type);
 return (flowMode==='step'&&flowIndex===6?matching.at(-1):matching[0])||events[0];
}
function renderFlow(){
 $('flow-branch').hidden=flowMode!=='snapshot';
 if(flowMode==='snapshot')$('flow-branch').innerHTML='<div class="branch-entry"><button data-flow-index="2">选择节点类型</button><p>初始节点 → C0<br>完整步骤 → Ci</p></div><div class="branch-options"><button data-flow-index="2">C0 · 引用基座<small>核对 UUID 与只读属性</small></button><button data-flow-index="2">Ci · 保存 CoW 快照<small>暂停进程 → 同步 → 快照 → 恢复进程</small></button></div><div class="branch-merge"><button data-flow-index="4">保存 State、配置与测量<small>所有快照共享未变化的数据块</small></button><span>↓</span><button data-flow-index="6">复查边界 → 原子提交节点</button></div>';
 document.querySelectorAll('[data-flow]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.flow===flowMode));
 const steps=FLOW[flowMode],f=steps[flowIndex];
 $('flow-path').innerHTML=steps.map((v,i)=>`<button class="flow-node ${i===flowIndex?'active':''}" data-flow-index="${i}" aria-pressed="${i===flowIndex}"><span class="idx">${v[0]}</span><span><strong>${v[1]}</strong><small>${v[2]}</small></span></button>`).join('');
 $('flow-explanation').innerHTML=`<span class="tag input">${f[0]} · ${f[2]}</span><h2>${f[1]}</h2><p>${f[3]}</p><ol class="flow-items">${f[4].map((t,i)=>`<li><span>0${i+1}</span>${t}</li>`).join('')}</ol><div class="flow-rule">${f[5]}</div><div class="flow-links"><button data-related="${relatedRecord(f).id}">在真实轨迹中查看 →</button>${flowMode==='overall'&&flowIndex===6?'<button data-open-flow="step">展开一个 Step →</button>':''}${(flowMode==='overall'&&flowIndex===5)||(flowMode==='step'&&flowIndex===8)?'<button data-open-flow="snapshot">展开快照子流程 →</button>':''}</div><p class="flow-source">源码位置<br>${f[6]}</p>`;
}
function openFlow(mode){flowMode=mode;flowIndex=0;setView('flow');renderFlow();}

$('record-status').textContent=D.status==='recorded'?'录制完成':D.status;
$('end-status').textContent=D.run_end_status==='paused'?(D.agent_exit_status==='LimitsExceeded'?'预算暂停':'已暂停'):D.run_end_status;
$('run-label').textContent=D.task_id+' · '+D.run_name;
$('duration').disabled=!D.timeline_complete;
$('duration').setAttribute('aria-pressed',durationMode);
$('duration').textContent=durationMode?'◷ 真实时长':'▥ 等宽事件';
$('top-stats').innerHTML=`<span><strong class="number">${seconds(D.total_sec)}</strong>总耗时</span><span class="snapshot-stat"><strong class="number">${seconds(D.capture_total_sec)}</strong>快照与提交</span><span class="store-stat"><strong class="number">${bytes(D.storage.store_file_bytes)}</strong>轨迹元数据</span>`;
$('source-content').innerHTML=`<h3>已保存的录制数据</h3><p>${esc(D.run_name)}<br>${D.nodes.length} 个已提交节点。录制状态 ${esc(D.status)}；结束状态 ${esc(D.run_end_status)}（${esc(D.agent_exit_status)}）；任务评测状态 ${esc(D.task_success)}。</p><div class="paths">${esc(D.report_path)}<br>record/catalog.sqlite · StateCapture · Execution · Event · Node</div><h3>Btrfs 基座与存储</h3>${pretty(D.preload)}<p>池镜像占用是各节点保存时记录的物理已分配空间；容量是逻辑上限。相对 C0 的增长是池级测量，包含共享数据和其他工作区，不是快照独占空间。轨迹元数据另计。</p><h3>读取方式与边界</h3><ul><li>页面仅包含轨迹证据与快照引用，可离线打开；生成及查看时不连接 Docker、不挂载存储池、不扫描任务文件。</li><li>录制总耗时来源：${esc(D.timing_source)}。record.total 包含预检，不含最终计时写回；report.duration_sec 从预检之后计时。两者均不包含此前的 preload 构建成本。</li><li>当前计时明细：${D.timeline_complete?'完整':'未采集或已截断；按事件顺序展示，缺失值不推算'}。开启 debug 仅影响详细终端显示。</li><li>快照与提交耗时包含其内部子项，不重复相加。</li><li>微小事件保留可点击宽度；等宽模式仅表达顺序。</li><li>浏览播放只切换已保存记录，不执行 Replay 或环境恢复。</li><li>报告中的完整性检查：${D.verification.checked?(D.verification.ok?'通过':'未通过'):'未执行'}。本页不额外执行文件恢复校验或任务评测。</li><li>恢复仍需原始轨迹、基座与对应的 Btrfs 存储池。</li></ul>`;
$('tab-trace').onclick=()=>setView('trace');$('tab-flow').onclick=()=>{setView('flow');renderFlow();};
$('duration').onclick=()=>{durationMode=!durationMode;$('duration').setAttribute('aria-pressed',durationMode);$('duration').textContent=durationMode?'◷ 真实时长':'▥ 等宽事件';renderPhases();renderTimeline();};
$('fold').onclick=()=>{const all=D.groups.every(g=>collapsed.has(g.id));collapsed=all?new Set():new Set(D.groups.map(g=>g.id));$('fold').setAttribute('aria-pressed',!all);$('fold').textContent=all?'⊟ 轮次':'⊞ 轮次';renderLedger();};
$('calls').onclick=()=>{hideTools=!hideTools;$('calls').setAttribute('aria-pressed',hideTools);$('calls').textContent=hideTools?'⊞ 工具调用':'⊟ 工具调用';refreshFilter();};

$('phase-ribbon').onclick=e=>{const b=e.target.closest('[data-phase]');if(b){stop();select(b.dataset.phase,{reveal:true});}};

$('phase-ribbon').onpointerleave=()=>{setActivePhase(null);$('tooltip').hidden=true;};
$('phase-ribbon').onfocusin=e=>{const b=e.target.closest('[data-phase-index]');setActivePhase(b?Number(b.dataset.phaseIndex):null);};
$('phase-ribbon').onfocusout=()=>setActivePhase(null);
$('detail').onclick=e=>{const b=e.target.closest('[data-detail]'),f=e.target.closest('[data-open-flow]');if(b){detailTab=b.dataset.detail;renderDetail();}if(f)openFlow(f.dataset.openFlow);};
$('previous').onclick=()=>{stop();move(-1);};$('next').onclick=()=>{stop();move(1);};$('position').oninput=e=>{stop();const record=listEvents()[Number(e.target.value)];if(record)select(record.id);};
$('play').onclick=()=>{if(timer!==null){stop();return;}if(selected===listEvents().at(-1)?.id)select(listEvents()[0].id);$('play').textContent='Ⅱ 暂停浏览';$('play').setAttribute('aria-pressed','true');timer=setInterval(()=>{if(!move(1))stop();},1600);};
$('sources').onclick=()=>$('source-dialog').showModal();$('source-dialog').querySelector('.close').onclick=()=>$('source-dialog').close();$('source-dialog').onclick=e=>{if(e.target===$('source-dialog')){const r=e.target.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)e.target.close();}};
document.querySelectorAll('[data-flow]').forEach(b=>b.onclick=()=>openFlow(b.dataset.flow));$('flow-branch').onclick=e=>{const b=e.target.closest('[data-flow-index]');if(b){flowIndex=Number(b.dataset.flowIndex);renderFlow();}};$('flow-path').onclick=e=>{const b=e.target.closest('[data-flow-index]');if(b){flowIndex=Number(b.dataset.flowIndex);renderFlow();}};
$('flow-explanation').onclick=e=>{const f=e.target.closest('[data-open-flow]'),r=e.target.closest('[data-related]');if(f)openFlow(f.dataset.openFlow);if(r){setView('trace');select(r.dataset.related,{reveal:true});}};
document.addEventListener('keydown',e=>{if(e.target.closest('input,select,textarea,dialog')||!$('flow-view').hidden)return;if(e.key==='ArrowRight'){e.preventDefault();stop();move(1);}if(e.key==='ArrowLeft'){e.preventDefault();stop();move(-1);}});

window.addEventListener('hashchange',()=>{const id=location.hash.slice(1);if(byId.has(id)){setView('trace');select(id,{reveal:true});}});
renderPhases();renderLedger();renderTimeline();renderNodes();renderDetail();updatePlayer();renderFlow();
